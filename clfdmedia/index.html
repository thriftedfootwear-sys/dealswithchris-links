<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>clfdmedia Finds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap">
<style>
/* dealswithchris look: blue animated-wave ground, white pill buttons with hard black shadow, Arvo slab, white type. Single committed theme. */
:root{
  --bg:#216ab5; --pill:#ffffff; --pill-ink:#000000; --ink:#ffffff; --ink-soft:rgba(255,255,255,.85);
  --shadow:#000000; --slab:'Arvo','Georgia',serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--slab);margin:0;padding-block:0 60px;padding-inline:16px;font-size:15px;line-height:1.5;overflow-x:hidden}
.waves{position:fixed;inset:auto 0 0 0;height:34vh;pointer-events:none;z-index:0;opacity:.35}
.waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.w1{animation:drift 18s linear infinite}
.w2{animation:drift 28s linear infinite reverse;opacity:.6}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.w1,.w2{animation:none}}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}
header{text-align:center;padding-block:34px 10px}
.avatar{width:92px;height:92px;border-radius:50%;background:var(--pill);color:var(--bg);font:700 34px var(--slab);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:4px 4px 0 var(--shadow)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
h1{font:700 20px var(--slab);margin:0}
.bio{color:var(--ink-soft);font-size:13.5px;margin-top:6px}
.socials{margin-top:10px}
.socials a{display:inline-block;color:var(--ink)}
.socials svg{width:26px;height:26px;fill:currentColor}
.search{position:sticky;top:0;padding-block:14px 8px;z-index:5}
.search input{width:100%;font:15px var(--slab);color:var(--pill-ink);background:var(--pill);border:2px solid var(--shadow);border-radius:999px;padding:13px 20px;box-shadow:4px 4px 0 var(--shadow)}
.search input::placeholder{color:#555}
.search input:focus{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}
.count{color:var(--ink-soft);font-size:12px;text-align:center;margin:4px 0 12px}
#list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
a.item{display:flex;flex-direction:column;background:var(--pill);color:var(--pill-ink);border:2px solid var(--shadow);border-radius:16px;overflow:hidden;text-decoration:none;text-align:left;box-shadow:5px 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
a.item:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--shadow)}
a.item:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--shadow)}
a.item:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ithumb{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--shadow)}
.ithumb img{width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box}
.ithumb .ph{font:700 30px var(--slab);color:#d8d8d8}
.ibody{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.iname{font-weight:700;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.icolor{font-size:11.5px;color:#444;margin-top:2px}
.ibtn{margin-top:auto;padding-top:8px;font-size:12px;font-weight:700;color:var(--bg)}
@media (min-width:480px){#list{grid-template-columns:1fr 1fr 1fr}}
.empty{border:2px dashed rgba(255,255,255,.6);border-radius:18px;padding:26px 18px;text-align:center;color:var(--ink-soft)}
footer{text-align:center;color:var(--ink-soft);font-size:11px;margin-top:30px;line-height:1.6}
</style>
</head><body>

<script>
(() => {
"use strict";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let products=[];
try{products=JSON.parse(document.getElementById("products").textContent)||[];}catch(e){products=[];}
const list=document.getElementById("list"),count=document.getElementById("count"),q=document.getElementById("q");
function render(term){
  const t=(term||"").trim().toLowerCase();
  const hits=t?products.filter(p=>((p.name||"")+" "+(p.color||"")+" "+(p.kw||"")).toLowerCase().includes(t)):products;
  count.textContent=t?hits.length+" match"+(hits.length===1?"":"es"):products.length+" products";
  list.innerHTML=hits.length?hits.map(p=>`<a class="item" href="${esc(p.url)}" target="_blank" rel="noopener sponsored">
    <div class="ithumb">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">`:`<div class="ph">CLFD</div>`}</div>
    <div class="ibody">
      <div class="iname">${esc(p.amz_title||p.name)}</div>
      ${p.color&&!p.amz_title?`<div class="icolor">${esc(p.color)}</div>`:""}
      <div class="ibtn">Shop on Amazon →</div>
    </div>
  </a>`).join(""):`<div class="empty">Nothing matches "${esc(term)}" — try one word, like “light” or “car”.</div>`;
}
q.addEventListener("input",()=>render(q.value));
render("");
})();
</script>
