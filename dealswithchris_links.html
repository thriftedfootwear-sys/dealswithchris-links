<title>DealsWithChris</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap">
<style>
/* dealswithchris look: blue animated-wave ground, white product cards with hard black shadow, Arvo slab. Single committed theme. */
:root{
  --bg:#216ab5; --card:#ffffff; --card-ink:#000000; --ink:#ffffff; --ink-soft:rgba(255,255,255,.85);
  --band:#0f3e75; --shadow:#000000; --slab:'Arvo','Georgia',serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--slab);margin:0;padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:15px;line-height:1.5;overflow-x:hidden}
.waves{position:fixed;inset:auto 0 0 0;height:34vh;pointer-events:none;z-index:0;opacity:.35}
.waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.w1{animation:drift 18s linear infinite}
.w2{animation:drift 28s linear infinite reverse;opacity:.6}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.w1,.w2{animation:none}}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}
header{text-align:center;padding-block:34px 10px}
.avatar{width:92px;height:92px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:4px 4px 0 var(--shadow)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
h1{font:700 20px var(--slab);margin:0}
.bio{color:var(--ink-soft);font-size:13.5px;margin-top:6px}
.socials{margin-top:10px}
.socials a{display:inline-block;color:var(--ink)}
.socials svg{width:26px;height:26px;fill:currentColor}
.search{position:sticky;top:env(safe-area-inset-top,0px);padding-block:14px 8px;z-index:5}
.search input{width:100%;font:15px var(--slab);color:var(--card-ink);background:var(--card);border:2px solid var(--shadow);border-radius:999px;padding:13px 20px;box-shadow:4px 4px 0 var(--shadow)}
.search input::placeholder{color:#555}
.search input:focus{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}
.count{color:var(--ink-soft);font-size:12px;text-align:center;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a.card{display:flex;flex-direction:column;background:var(--card);color:var(--card-ink);border:2px solid var(--shadow);border-radius:18px;overflow:hidden;text-decoration:none;box-shadow:5px 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s;min-width:0}
a.card:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--shadow)}
a.card:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--shadow)}
a.card:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ph{aspect-ratio:1;min-height:0;background:#fff;padding:10px;overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:contain}
.meta{background:var(--band);color:#fff;padding:10px 12px 12px;flex:1}
.iname{font-weight:700;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.iprice{font-size:13.5px;margin-top:4px;color:rgba(255,255,255,.9);font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;border:2px dashed rgba(255,255,255,.6);border-radius:18px;padding:26px 18px;text-align:center;color:var(--ink-soft)}
footer{text-align:center;color:var(--ink-soft);font-size:11px;margin-top:30px;line-height:1.6}
</style>

<script>
(() => {
"use strict";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let products=[];
try{products=(JSON.parse(document.getElementById("products").textContent)||[]).sort((a,b)=>(b.added||"").localeCompare(a.added||""));}catch(e){products=[];}
const list=document.getElementById("list"),count=document.getElementById("count"),q=document.getElementById("q");
function render(term){
  const t=(term||"").trim().toLowerCase();
  const hits=t?products.filter(p=>((p.name||"")+" "+(p.kw||"")).toLowerCase().includes(t)):products;
  count.textContent=t?hits.length+" match"+(hits.length===1?"":"es"):products.length+" products";
  list.innerHTML=hits.length?hits.map(p=>`<a class="card" href="${esc(p.url)}" target="_blank" rel="noopener sponsored">
    <div class="ph"><img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy"></div>
    <div class="meta"><div class="iname">${esc(p.name)}</div><div class="iprice">${esc(p.price)}</div></div>
  </a>`).join(""):`<div class="empty">Nothing matches "${esc(term)}" — try one word, like "roach" or "sheets".</div>`;
}
q.addEventListener("input",()=>render(q.value));
render("");
})();
</script>
